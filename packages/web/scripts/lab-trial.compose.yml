name: blog-reader-lab-trial

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
    environment:
      POSTGRES_DB: magazine_trial
      POSTGRES_USER: ${LAB_TRIAL_DB_USER:?Run lab-trial.mjs}
      POSTGRES_PASSWORD: ${LAB_TRIAL_DB_PASSWORD:?Run lab-trial.mjs}
    ports:
      - '127.0.0.1:55444:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d magazine_trial']
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - trial-postgres:/var/lib/postgresql

  storage:
    image: versity/versitygw:v1.5.0@sha256:7d56e0a6c246f00e2385ba4fe84065981959be1d822648f88a155c82e0e0652d
    environment:
      ROOT_ACCESS_KEY_ID: ${LAB_TRIAL_S3_ACCESS_KEY:?Run lab-trial.mjs}
      ROOT_SECRET_ACCESS_KEY: ${LAB_TRIAL_S3_SECRET_KEY:?Run lab-trial.mjs}
    command:
      - --port
      - :7070
      - --health
      - /health
      - --quiet
      - posix
      - --sidecar
      - /data/metadata
      - --versioning-dir
      - /data/versioning
      - /data/objects
    ports:
      - '127.0.0.1:57044:7070'
    volumes:
      - trial-metadata:/data/metadata
      - trial-objects:/data/objects
      - trial-versioning:/data/versioning

volumes:
  trial-postgres:
  trial-metadata:
  trial-objects:
  trial-versioning:
